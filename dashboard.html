<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace équipe — SSlivraison</title><link rel="stylesheet" href="dashboard.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body>
<header><a class="brand" href="index.html"><span>S</span>SS<span>livraison</span></a><div><span id="connection">Hors ligne</span><button id="logout">Se déconnecter</button></div></header>
<main><section id="loginPanel" class="panel login"><p class="eyebrow">ESPACE ÉQUIPE</p><h1>Gérer les commandes.</h1><p>Connectez-vous avec votre compte livreur ou administrateur.</p><input id="email" type="email" placeholder="Email professionnel"><input id="password" type="password" placeholder="Mot de passe"><button class="primary" id="login">Se connecter</button><small id="loginError"></small></section>
<section id="appPanel" hidden><div class="heading"><div><p class="eyebrow">TABLEAU DE BORD</p><h1>Les commandes du jour</h1></div><button class="primary" id="refresh">↻ Actualiser</button></div><div class="stats"><div><small>En attente</small><b id="pendingCount">0</b></div><div><small>En cours</small><b id="activeCount">0</b></div><div><small>Livrées aujourd’hui</small><b id="doneCount">0</b></div></div><div class="location panel"><div><h2>Position du livreur</h2><p>Activez le partage GPS pendant vos tournées.</p></div><button class="primary" id="shareLocation">Partager ma position</button></div><div id="map"></div><div id="orders" class="orders"></div></section></main><div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="dashboard.js"></script></body></html>
